<section class="bg-stone-600 px-[1rem] py-2" aria-labelledby="share-title">
    <div class="border-t-[0.3rem] border-dotted border-black pt-3">
        <h2 id="share-title" class="text-center text-2xl font-bangers text-black mb-4">
            Share this post
        </h2>

        <div class="flex flex-wrap justify-center gap-3 font-verdana font-bold">
            <!-- Reddit -->
            <a href="https://www.reddit.com/submit?url={{ .Permalink | urlquery }}&title={{ .Title | urlquery }}"
                target="_blank" rel="noopener noreferrer"
                class="inline-flex items-center rounded-lg bg-orange-600 px-4 py-2 text-white transition hover:scale-105 hover:bg-orange-700"
                aria-label="Share on Reddit">
                <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M21.5 12.5c0-1.1-.9-2-2-2-.5 0-1 .2-1.3.5-1.4-1-3.2-1.6-5.2-1.7l1-3.1 2.7.6a1.5 1.5 0 1 0 .3-1.2l-3-.7c-.3-.1-.6.1-.7.4l-1.1 4c-2 .1-3.8.7-5.2 1.7-.4-.3-.8-.5-1.3-.5a2 2 0 0 0-.8 3.8v.5c0 2.8 3.6 5.1 8.1 5.1s8.1-2.3 8.1-5.1v-.5c.3-.4.4-.9.4-1.4ZM9 13.5a1.1 1.1 0 1 1 0 2.2 1.1 1.1 0 0 1 0-2.2Zm6 4.2c-.8.6-1.9.9-3 .9s-2.2-.3-3-.9a.5.5 0 0 1 .6-.8c.6.4 1.4.6 2.4.6s1.8-.2 2.4-.6a.5.5 0 0 1 .6.8Zm0-2a1.1 1.1 0 1 1 0-2.2 1.1 1.1 0 0 1 0 2.2Z" />
                </svg>
                <span class="sr-only">Share on Reddit</span>
            </a>
            <!-- X -->
            <a href="https://x.com/intent/post?url={{ .Permalink | urlquery }}&text={{ .Title | urlquery }}"
                target="_blank" rel="noopener noreferrer"
                class="inline-flex items-center rounded-lg bg-black px-4 py-2 text-white transition hover:scale-105 hover:bg-neutral-800"
                aria-label="Share on X">
                <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.657l-5.214-6.817-5.963 6.817H1.684l7.73-8.835L1.258 2.25h6.826l4.713 6.231 5.447-6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77Z" />
                </svg>
                <span class="sr-only">Share on X</span>
            </a>


            <!-- Telegram -->
            <a href="https://t.me/share/url?url={{ .Permalink | urlquery }}&text={{ .Title | urlquery }}"
                target="_blank" rel="noopener noreferrer"
                class="inline-flex items-center rounded-lg bg-sky-500 px-4 py-2 text-white transition hover:scale-105 hover:bg-sky-600"
                aria-label="Share on Telegram">
                <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="m21.8 3.2-3.1 17.1c-.2 1.2-.9 1.5-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6.1 13.9l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6L20.5 3c.9-.3 1.7.2 1.3.2Z" />
                </svg>
                <span class="sr-only">Share on Telegram</span>
            </a>


            <!-- Copy link -->
            <button type="button" id="copyPostLink"
                class="inline-flex items-center rounded-lg bg-stone-900 px-4 py-2 text-white transition hover:scale-105 hover:bg-stone-800"
                data-copy-url="{{ .Permalink }}">
                <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2">
                    <path d="M9 15 15 9" />
                    <path d="M7 17H6a4 4 0 0 1 0-8h4" />
                    <path d="M17 7h1a4 4 0 0 1 0 8h-4" />
                </svg>
                <span class="sr-only">Copy link</span>
            </button>
        </div>

        <p id="copyStatus" class="mt-3  text-center  text-amber-200 bg-neutral-950" aria-live="polite"></p>
    </div>
</section>

<script>
    document.getElementById('copyPostLink').addEventListener('click', async function () {
        const status = document.getElementById('copyStatus');
        const url = this.dataset.copyUrl;

        try {
            await navigator.clipboard.writeText(url);
            status.textContent = 'Link copied!';
        } catch {
            status.textContent = 'Unable to copy the link.';
        }

        setTimeout(() => {
            status.textContent = '';
        }, 2500);
    });
</script>
