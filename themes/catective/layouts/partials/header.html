<header  class="bg-stone-600 border-b-[0.3rem] border-black font-bangers text-2xl">
    <div class="flex items-center m-auto w-5/6 md:w-3/5 flex-wrap gap-x-4">
        <a href="{{ .Site.Home.RelPermalink }}" class="mr-auto font-MajorMonoDisplay shrink-0">
            <h1 class="text-3xl md:text-4xl md:font-black">{{ site.Params.sitename | default "amirany.ir" }}</h1>
        </a>

        <!-- Desktop Search Bar (Hidden on small screens) -->
        <form action="{{ "search/" | relURL }}" method="GET" role="search"
            class="relative hidden font-tgnd lg:flex flex-1 min-w-[140px] max-w-xs my-1" data-search-form
            data-search-index="{{ "index.json" | relURL }}">
            <div class="relative  flex items-center w-full">
                <input type="search" name="q" placeholder="⌕ Search Posts..."
                    class="w-full bg-transparent text-white placeholder-amber-100  text-lg lg:text-xl focus:outline-none border-b-2 border-stone-800 focus:border-black transition-colors px-1 py-0.5"
                    aria-label="Search" autocomplete="off" aria-controls="desktop-search-results" />
            </div>
            <div id="desktop-search-results" data-search-results
                class="absolute left-0 right-0 top-full z-50 mt-1 hidden max-h-[70vh] overflow-y-auto rounded-md border-2 border-black bg-neutral-950 text-base shadow-lg"
                role="listbox"></div>
        </form>

        <nav class="hidden md:flex space-x-[2rem]  bg-slate-950 px-2 my-1 rounded-md items-center  shrink-0">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}" class="text-amber-100 hover:text-stone-400 transition-colors duration-300">
                {{ .Name }}
            </a>
            {{ end }}
        </nav>

        <button id="mobile-menu-button" class="md:hidden text-black focus:outline-none ml-auto"
            aria-label="Toggle menu">
            <svg class="w-[2.5rem] h-[2.5rem]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>

    <!-- Mobile Navigation -->
    <nav id="mobile-menu" class="hidden md:hidden fixed inset-0 bg-stone-700 z-50">
        <div class="flex flex-col items-center justify-center h-full space-y-8">
            <button id="close-menu-button" class="absolute top-4 right-4 text-white focus:outline-none"
                aria-label="Close menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <!-- Mobile Search Bar -->
            <form action="{{ "search/" | relURL }}" method="GET" role="search" class="font-tgnd relative w-4/5 max-w-xs"
                data-search-form data-search-index="{{ "index.json" | relURL }}">
                <div class="relative flex items-center w-full">
                    <input type="search" name="q" placeholder="⌕ Search Posts..."
                        class="w-full bg-transparent text-white placeholder-amber-100  text-2xl focus:outline-none border-b-2 border-stone-800 focus:border-amber-400 transition-colors px-1 py-1 text-center"
                        aria-label="Search mobile" autocomplete="off" aria-controls="mobile-search-results" />
                </div>
                <div id="mobile-search-results" data-search-results
                    class="absolute left-0 right-0 top-full z-50 mt-1 hidden max-h-[70vh] overflow-y-auto rounded-md border-2 border-black bg-neutral-950 text-base shadow-lg"
                    role="listbox"></div>
            </form>

            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}"
                class="text-stone-400 text-4xl no-underline hover:text-amber-400 transition-colors duration-300">
                {{ .Name }}
            </a>
            {{ end }}

            <div class="flex-col space-y-2">
                {{ partial "social-links.html" . }}
            </div>
        </div>
    </nav>
</header>
